[package]
name = "usiem-parsers"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Log parsers for uSIEM: Linux daemons, network appliances and Windows event log JSON."
license = "MIT"
repository = "https://github.com/u-siem/parsers"
homepage = "https://github.com/u-siem/parsers"
readme = "README.md"
keywords = ["siem", "logging", "parser", "syslog", "security"]
categories = ["parser-implementations"]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
usiem = { git = "https://github.com/u-siem/usiem", rev = "853e48b0900612e2cce0ba750adb38d9bb6c2650", features = ["json"] }
regex = "1"
serde_json = "1"
time = { version = "0.3", features = ["parsing", "macros"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.dev.package."*"]
opt-level = 2
